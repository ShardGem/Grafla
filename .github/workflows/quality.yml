name: Testes e instalador do Grafla
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install Qt headless runtime on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0
      - run: uv sync --frozen --extra dev --extra build --python ${{ matrix.python }}
      - run: uv run ruff check src tests tools main.py
      - run: uv run ruff format --check src tests tools main.py
      - run: uv run mypy
      - run: uv run pytest --junitxml=test-results.xml --cov=grafla.domain --cov=grafla.persistence --cov=grafla.algorithms --cov=grafla.physics --cov-branch --cov-fail-under=80
      - name: Report test failures in the run summary
        if: failure()
        run: python tools/report_test_failures.py test-results.xml

  desktop:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --frozen --extra build
      - name: Gerar e testar o aplicativo e o instalador
        run: uv run python tools/criar_instalador.py
      - name: Testar a instalação e a remoção
        shell: pwsh
        run: |
          $setup = (Get-ChildItem "dist/installer/*-Setup.exe").FullName
          $installDir = Join-Path $env:RUNNER_TEMP "Grafla instalado"
          $smokeDir = Join-Path $env:RUNNER_TEMP "Grafla teste instalado"
          try {
            $install = Start-Process -FilePath $setup -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=`"$installDir`"") -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "A instalação falhou: $($install.ExitCode)" }
            if (-not (Test-Path "$installDir/unins000.exe")) { throw "O desinstalador não foi criado." }
            $process = Start-Process -FilePath "$installDir/Grafla.exe" -ArgumentList @("--smoke-test", "--no-splash", "--data-dir", "`"$smokeDir`"") -PassThru
            if (-not $process.WaitForExit(30000)) { $process.Kill($true); throw "O Grafla instalado não encerrou o teste." }
            if ($process.ExitCode -ne 0) {
              if (Test-Path "$smokeDir/grafla.log") { Get-Content "$smokeDir/grafla.log" }
              throw "O Grafla instalado falhou: $($process.ExitCode)"
            }
            if (-not (Test-Path "$smokeDir/smoke-icon.png")) { throw "O aplicativo instalado não carregou o ícone." }
          } finally {
            if (Test-Path "$installDir/unins000.exe") {
              $uninstall = Start-Process -FilePath "$installDir/unins000.exe" -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
              if ($uninstall.ExitCode -ne 0) { throw "A desinstalação falhou: $($uninstall.ExitCode)" }
              if (Test-Path "$installDir/Grafla.exe") { throw "O executável permaneceu após a desinstalação." }
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Grafla-Windows-Instalador
          path: dist/installer/*-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Grafla-Windows-Portatil
          path: dist/Grafla/
          if-no-files-found: error
