[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grafla"
dynamic = ["version"]
description = "Editor desktop para construir, explorar e compreender grafos"
readme = "README.md"
requires-python = ">=3.12,<3.16"
dependencies = ["PyQt6==6.12.0", "networkx==3.7"]

[project.scripts]
grafla = "grafla.app:main"

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-qt==4.5.0", "pytest-cov>=7,<8", "ruff==0.17.3", "mypy==2.4.1"]
build = ["pyinstaller==6.22.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grafla = ["resources/*"]

[tool.setuptools.dynamic]
version = {attr = "grafla.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src/grafla/domain.py", "src/grafla/persistence.py", "src/grafla/algorithms.py", "src/grafla/physics.py"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["networkx", "networkx.*"]
ignore_missing_imports = true
